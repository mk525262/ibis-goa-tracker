name: Goa Ibis Price Tracker

on:
  workflow_dispatch:
  push:
    paths:
      - "tracker.py"
      - ".github/workflows/goa-tracker.yml"
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Test Telegram on manual run
        if: github.event_name == 'workflow_dispatch'
        run: python telegram_test.py

      - name: Check Goa rate
        run: python tracker.py

      - name: Commit price history
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update Goa price history"
          file_pattern: data/price_history.json
