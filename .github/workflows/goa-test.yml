name: Goa Ibis Telegram Test

on:
  push:
    paths:
      - ".github/workflows/goa-test.yml"

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -e
          CHAT_ID=$(curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" | python -c 'import json,sys; d=json.load(sys.stdin); u=d.get("result",[]); print(next(str(x["message"]["chat"]["id"]) for x in reversed(u) if x.get("message",{}).get("chat",{}).get("id") is not None))')
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data "{\"chat_id\":\"${CHAT_ID}\",\"text\":\"🧪 GOA IBIS TRACKER TEST\n\n🏨 ibis Styles Goa Calangute\nStay: 28 Nov → 2 Dec 2026\nGuests: 2\nRoom: Standard Twin Room – Pool View\nRate: Flexible Rate – Half Board\n\n💰 Test price: ₹37,605.75\n\n✅ Telegram alert system test successful.\"}"
